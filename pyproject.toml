[project]
name = "kitten-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "litellm>=1.50.0",
    "pathspec>=0.12.0",
    "filelock>=3.13.0",
    "textual>=0.70.0",
    "tomlkit>=0.15.0",
]

[project.scripts]
kitten = "kitten_cli.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
