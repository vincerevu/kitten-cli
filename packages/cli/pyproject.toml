[project]
name = "kitten-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "kitten-core",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.scripts]
kitten = "kitten_cli.main:app"

[tool.uv.sources]
kitten-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
